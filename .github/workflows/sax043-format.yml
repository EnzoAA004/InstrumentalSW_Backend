name: SAX-043 Format

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw --batch-mode --no-transfer-progress spotless:apply
      - uses: actions/upload-artifact@v6
        with:
          name: sax043-backend-formatted
          path: |
            src/main/java
            src/test/java
          retention-days: 1
