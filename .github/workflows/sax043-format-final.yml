name: SAX-043 Final Format

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw --batch-mode --no-transfer-progress spotless:apply
      - name: Commit exact Spotless output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/test/java/com/instrumentalsw/backend/infrastructure/ai/FastApiTranscriptionRevisionClientTest.java \
            src/test/java/com/instrumentalsw/backend/web/TranscriptionRevisionControllerTest.java
          if git diff --cached --quiet; then
            echo "No formatter changes"
          else
            git commit -m "refactor(SAX-043): apply pinned Spotless formatting"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi
