name: Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backend-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Make Maven Wrapper executable
        run: chmod +x mvnw
      - name: Verify
        shell: bash
        run: |
          set -o pipefail
          ./mvnw --batch-mode --no-transfer-progress verify 2>&1 | tee verify.log
      - name: Apply pinned formatter
        if: failure()
        run: ./mvnw --batch-mode --no-transfer-progress spotless:apply
      - name: Commit formatter result
        if: failure()
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatter changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/instrumentalsw/backend/domain/TranscriptionException.java
          git add src/main/java/com/instrumentalsw/backend/infrastructure/ai/FastApiTranscriptionClient.java
          git add src/test/java/com/instrumentalsw/backend/infrastructure/ai/UpstreamResponseCompatibilityTest.java
          git add src/test/java/com/instrumentalsw/backend/web/ExplicitUpstreamStatusTest.java
          git commit -m "style(SAX-040): format final backend regressions"
          git push origin HEAD:${{ github.head_ref }}
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-quality-evidence
          path: |
            verify.log
            target/site/jacoco/jacoco.xml
            target/site/jacoco/jacoco.csv
          if-no-files-found: warn
          retention-days: 3
